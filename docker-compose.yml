name: founderconsole

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://fundflow:${POSTGRES_PASSWORD}@db:5432/fundflow
      REDIS_URL: redis://redis:6379/0
      NODE_ENV: production
      ENVIRONMENT: production
      PORT: "5000"
      FASTAPI_PORT: "8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "5000"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fundflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundflow -d fundflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not exposed to the internet. Uncomment to reach it from your laptop via SSH tunnel only.
    # ports:
    #   - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
