# Release Manager check suite + pytest, against the checkout — never production.
#
# Runs on every pull request regardless of base branch, on every push to main,
# and on demand. The earlier dispatch-only hold was about paid Actions minutes;
# predixen is a PUBLIC repo, and GitHub-hosted runners are free for public
# repos, so gating every PR costs nothing.
# `pull_request` (not `pull_request_target`) gets no secrets on fork PRs.
#
# Out of scope (they hit live founderconsole.ai / Railway):
#   scripts/launch_gate.sh, Playwright journeys, Google signup, lead capture.
#
# Do not wire RAILWAY_DATABASE_URL or any backup secret. Postgres-backed
# pytest cases already skip when no local DB is reachable.
#
# The QA lab (qa-lab/runner/qa_runner.py) DOES run here, on a disposable SQLite
# file under $RUNNER_TEMP. It seeds synthetic companies, so it needs a schema and
# writes rows - that is why nothing ran it before, and why OPERATING-MODEL.md
# could list it in the golden path for months while no process executed it. The
# rows it writes live in the runner's own temporary directory: never production,
# never a secret, discarded when the job ends.
#
# DATABASE_URL is set on the two QA-lab steps ONLY. It is deliberately NOT set on
# `Run pytest`, so the Postgres-backed pytest cases keep skipping exactly as they
# do today - changing that is a separate decision about a separate suite.
name: pr-checks

on:
  # A push to main is what deploys production - Railway builds from main on every
  # push - so main's own head is the one commit that must be checked. Without
  # this, the commit that ships is the only commit nothing checks: a green check
  # attaches to a PR's head, not to the merge commit that lands. Measured before
  # this change at main 57fece84: /commits/57fece84/check-runs -> total_count 0.
  push:
    branches: [main]
  # No `branches:` filter here, deliberately. Under `pull_request`, `branches`
  # filters on the BASE branch, so `branches: [main]` silently skipped every
  # stacked PR: GitHub scheduled no workflow and reported mergeable_state
  # "clean", which means "no conflict", never "tested". Measured on PR #60's
  # stacked head 7adfb9e6 while the PR read clean:
  # /commits/7adfb9e6/check-runs -> total_count 0.
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# A new push to the same PR supersedes the previous run.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node build, tsc budget, TS tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Measured on this branch at 9c706b55 with:
      #   npm run check -- --pretty false --incremental false
      #   grep -cE ': error TS[0-9]+'
      # Result: 82. That is also the historical Release Manager note in
      # agents/ORG-22.md ("82 errors counts as a pass") — a snapshot of main,
      # not a forever target. Fail only if the count rises. Prefer 0; if it
      # drops, lower this number.
      TSC_ERROR_BUDGET: "82"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck (must not exceed error budget)
        run: bash scripts/tsc-error-budget.sh

      - name: geoRestrict tests
        run: npx tsx --test server/tests/geoRestrict.test.ts

      - name: analytics-single-identity tests
        run: npx tsx server/tests/analytics-single-identity.test.ts

      - name: lead-form-viewed tests
        run: npx tsx server/tests/lead-form-viewed.test.ts

      - name: simulation v2 client payload tests
        run: npx tsx server/tests/simulation-v2-client-payload.test.ts

      - name: session-401-redirect tests
        run: npx tsx --test server/tests/session-401-redirect.test.ts

      - name: activation-path dead-route tests
        run: npx tsx server/tests/activation-dead-routes.test.ts

      - name: residual dead-route alias tests
        run: npx tsx server/tests/residual-dead-routes.test.ts

      - name: truth-scan suggested actions tests
        run: npx tsx server/tests/truth-scan-suggested-actions.test.ts

      - name: overview suggested action tests
        run: npx tsx server/tests/overview-suggested-action.test.ts

      - name: entry-bundle no framer-motion on critical path
        run: npx tsx server/tests/entry-no-framer-motion.test.ts

      - name: entry-bundle no static posthog-js
        run: npx tsx server/tests/entry-no-posthog-js.test.ts

      - name: company switcher select chunk failure
        run: npx tsx server/tests/company-switcher-select-load.test.ts

      - name: runway-industry SSR tests
        run: npx tsx --test server/tests/runway-industry-ssr.test.ts

      - name: soft 404 status for unknown tools and industries
        run: npx tsx --test server/tests/soft-404-status.test.ts

      - name: compare SSR tests
        run: npx tsx --test server/tests/compare-ssr.test.ts

      - name: product SSR tests
        run: npx tsx --test server/tests/product-ssr.test.ts

      - name: customers SSR tests
        run: npx tsx --test server/tests/customers-ssr.test.ts

      - name: use-cases SSR tests
        run: npx tsx --test server/tests/use-cases-ssr.test.ts

      - name: how-it-works SSR tests
        run: npx tsx --test server/tests/how-it-works-ssr.test.ts

      - name: alternatives SSR tests
        run: npx tsx --test server/tests/alternatives-ssr.test.ts

      - name: signup SSR tests
        run: npx tsx --test server/tests/signup-ssr.test.ts

      - name: security SSR tests
        run: npx tsx --test server/tests/security-ssr.test.ts

      - name: auth-critical-routes tests
        run: npx tsx server/tests/auth-critical-routes.test.ts

      - name: legacy redirect tests
        run: npx tsx --test server/tests/legacy-redirects.test.ts

      - name: signup CTAs open the register tab
        run: npx tsx server/tests/signup-cta-register-tab.test.ts

      - name: sitemap.xml is generated, not hand-edited
        run: |
          npm run generate:sitemap
          git diff --exit-code -- client/public/sitemap.xml

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: entry-bundle posthog-js is a lazy chunk
        run: npx tsx server/tests/entry-no-posthog-js.test.ts

      - name: no render-blocking Google Fonts stylesheet
        run: npx tsx server/tests/no-google-fonts-blocking.test.ts

      - name: prerender coverage
        run: npx tsx server/tests/prerender-coverage.test.ts

      - name: sitemap drift test
        run: npx tsx server/tests/sitemap-drift.test.ts

      - name: api proxy routing test
        run: npx tsx --test server/tests/api-proxy-routing.test.ts

  python:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv (Python 3.11)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      # `uv sync --frozen` installs exactly what uv.lock says, which is the point -
      # but it also means a lockfile that has drifted from pyproject.toml is
      # invisible: CI would keep testing the old dependency set while the file
      # that declares the requirements says something else. --frozen refuses to
      # *update* the lock, it does not check that the lock is current.
      - name: Lockfile matches pyproject.toml
        run: uv lock --check

      - name: Install Python dependencies
        run: uv sync --frozen --no-dev --no-install-project

      - name: Run pytest
        run: uv run --no-sync pytest -ra

      # Golden-path exit criterion 2's second half. qa_runner.py opens
      # SessionLocal() and inserts - it never creates its own schema - so a
      # database with no tables is the first thing it hits. init_qa_db.py is the
      # schema half of server/main.py:210, for this throwaway file only.
      - name: Create the QA lab's disposable database
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/qa-lab.db
        run: uv run --no-sync python qa-lab/runner/init_qa_db.py

      - name: QA lab (golden path, exit criterion 2)
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/qa-lab.db
        run: uv run --no-sync python qa-lab/runner/qa_runner.py
